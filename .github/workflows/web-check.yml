name: Check web game hub
on:
  push:
    branches: [main, feat-web-v1]
    paths: ['web/**', 'scripts/web/**', 'scripts/bundle.mjs', 'scripts/resource-protocol.mjs', 'tests/web/**', 'e2e/web/**', 'package.json', 'pnpm-lock.yaml', '.github/workflows/web-check.yml']
  pull_request:
    paths: ['web/**', 'scripts/web/**', 'scripts/bundle.mjs', 'scripts/resource-protocol.mjs', 'tests/web/**', 'e2e/web/**', 'package.json', 'pnpm-lock.yaml', '.github/workflows/web-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/game-hub-browsers
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check:web
      - run: pnpm run test:web
      - run: pnpm run build:web -- --base /hub/
      - run: pnpm run verify:web
      - run: pnpm run test:web:build
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm run test:web:browser
      - uses: actions/upload-artifact@v5
        with:
          name: game-hub-web-preview
          path: .build/web-dist/
          if-no-files-found: error
