name: Build unsigned Android release candidate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - name: Require the exact current main commit
        run: |
          set -euo pipefail
          remote=$(git ls-remote origin refs/heads/main | cut -f1)
          test "$GITHUB_SHA" = "$remote"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - run: pnpm run check
      - run: pnpm run bundle
      - run: pnpm run verify:bundle
      - run: pnpm run audit:storage
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'
      - name: Test and build unsigned Release APK
        working-directory: android
        run: ./gradlew testDebugUnitTest assembleRelease --no-daemon
      - name: Verify candidate resources, version and permissions
        shell: bash
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-release-unsigned.apk
          test -f "$APK"
          python3 scripts/verify_apk.py "$APK" "$GITHUB_SHA"
          AAPT="$ANDROID_HOME/build-tools/34.0.0/aapt"
          "$AAPT" dump badging "$APK" | grep -E "^package: name='com\.xiaoxuhui\.gamehub' versionCode='2' versionName='0\.2\.0'([[:space:]]|$)"
          "$AAPT" dump permissions "$APK" > "$RUNNER_TEMP/apk-permissions.txt"
          grep '^uses-permission' "$RUNNER_TEMP/apk-permissions.txt" | \
            grep -v -E "^uses-permission: name='(com.xiaoxuhui.gamehub.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION|android.permission.INTERNET|android.permission.REQUEST_INSTALL_PACKAGES)'$" \
            > "$RUNNER_TEMP/unexpected-permissions.txt" || true
          test ! -s "$RUNNER_TEMP/unexpected-permissions.txt"
          mkdir -p release-candidate
          cp "$APK" release-candidate/game-hub-unsigned.apk
          sha256sum release-candidate/game-hub-unsigned.apk > release-candidate/unsigned-sha256.txt
          cp "$RUNNER_TEMP/apk-permissions.txt" release-candidate/permissions.txt
          test -z "$("$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "$APK" 2>/dev/null || true)"
      - name: Record bundled Android runtime dependencies
        working-directory: android
        run: ./gradlew :app:dependencies --configuration releaseRuntimeClasspath --no-daemon > ../release-candidate/releaseRuntimeClasspath.txt
      - uses: actions/upload-artifact@v5
        with:
          name: game-hub-unsigned-release-candidate
          path: release-candidate/
          if-no-files-found: error
