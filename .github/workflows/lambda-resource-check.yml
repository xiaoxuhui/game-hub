name: Lambda resource compatibility
on:
  push:
    paths:
      - 'examples/lambda-diagram-game/**'
      - 'examples/lambda-diagram-update-20261121/**'
      - 'examples/lambda-diagram-038-20261121/**'
      - 'examples/lambda-preserve-20261121/**'
      - 'examples/lambda-roundtrip-20261121/**'
      - 'examples/lambda-recovery-20261121/**'
      - 'scripts/lambda-preserve-sessions.mjs'
      - 'scripts/lambda-no-loss-regression.cjs'
      - 'scripts/lambda-export-roundtrip.mjs'
      - 'scripts/lambda-export-roundtrip-regression.cjs'
      - 'tests/lambda-export-roundtrip.test.mjs'
      - 'scripts/lambda-large-archive.mjs'
      - 'scripts/lambda-large-archive-regression.cjs'
      - 'tests/lambda-large-archive.test.mjs'
      - 'tests/lambda-preserve-sessions.test.mjs'
      - 'scripts/lambda-037-protection.mjs'
      - 'tests/lambda-v5-storage.test.mjs'
      - 'examples/lambda-diagram-omega-20261120/**'
      - 'scripts/lambda-omega-protection.mjs'
      - 'scripts/lambda-long-history-guard.inc.js'
      - 'scripts/lambda-*-experiment.cjs'
      - 'scripts/lambda-*-test.cjs'
      - 'tests/lambda-omega-*.test.mjs'
      - 'scripts/lambda-storage-integration.mjs'
      - 'scripts/lambda-storage-c5-integration.mjs'
      - 'scripts/lambda-hall-browser.cjs'
      - 'scripts/stage-upstreams.mjs'
      - 'dynamic-upstreams.lock.json'
      - 'dynamic-sources.lock.json'
      - 'tests/lambda-storage-integration.test.mjs'
      - 'tests/lambda-manual-restore.*'
      - '.github/workflows/lambda-resource-check.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/*.test.mjs tests/*.test.cjs
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/lambda-manual-restore.browser.cjs
      - run: node tests/lambda-manual-restore.browser.cjs
        env:
          LAMBDA_HALL_HTML_PATH: examples/lambda-diagram-038-20261121/lambda-lab.html
      - run: node scripts/lambda-30-second-regression.cjs
        env:
          LAMBDA_HALL_HTML_PATH: examples/lambda-diagram-038-20261121/lambda-lab.html
      - run: node scripts/lambda-hall-browser.cjs
      - run: node scripts/lambda-no-loss-regression.cjs
        env:
          LAMBDA_TEST_HTML: examples/lambda-recovery-20261121/lambda-lab.html
      - run: node scripts/lambda-no-loss-regression.cjs
        env:
          LAMBDA_TEST_HTML: examples/lambda-recovery-20261121/lambda-lab.html
          LAMBDA_MOBILE: '1'
      - run: node scripts/lambda-export-roundtrip-regression.cjs
        env:
          LAMBDA_TEST_HTML: examples/lambda-recovery-20261121/lambda-lab.html
      - run: node scripts/lambda-large-archive-regression.cjs
        env:
          LAMBDA_TEST_HTML: examples/lambda-recovery-20261121/lambda-lab.html
      - run: node scripts/lambda-experiment-build.cjs
      - run: node scripts/lambda-prerun-backup-experiment.cjs
      - run: node scripts/lambda-prerun-actions-experiment.cjs
      - run: node scripts/lambda-raw-import-experiment.cjs
      - run: node scripts/lambda-long-start-protection-test.cjs
      - run: node scripts/lambda-omega-long-import-test.cjs
      - run: node scripts/lambda-backup-management-test.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lambda-resource-evidence
          path: doc/evidence/n13-browser/
