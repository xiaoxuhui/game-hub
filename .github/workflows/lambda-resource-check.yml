name: Lambda resource compatibility
on:
  push:
    paths:
      - 'examples/lambda-diagram-game/**'
      - 'scripts/lambda-storage-integration.mjs'
      - 'scripts/test-lambda-hall-browser.cjs'
      - 'scripts/stage-upstreams.mjs'
      - 'tests/lambda-storage-integration.test.mjs'
      - '.github/workflows/lambda-resource-check.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node scripts/test-lambda-hall-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lambda-resource-evidence
          path: doc/evidence/n13-browser/
