name: Android emulator smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - run: pnpm test
      - run: pnpm run bundle
      - run: pnpm run verify:bundle
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Free build cache space for AVD
        run: |
          du -sh "$HOME/.gradle/caches" || true
          rm -rf "$HOME/.gradle/caches"
          df -h "$HOME"
          available_mb=$(df -Pm "$HOME" | awk 'NR == 2 {print $4}')
          if [ "$available_mb" -lt 7800 ]; then
            echo "Only ${available_mb} MB free; emulator requires more than 7373 MB" >&2
            exit 1
          fi
      - name: Enable KVM on the runner
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Install and open four games
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_2
          ram-size: 2048M
          disk-size: 2048M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -partition-size 2048
          pre-emulator-launch-script: bash scripts/check_emulator_disk.sh
          script: python3 scripts/emulator_smoke.py android/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload screenshots and UI hierarchy
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: game-hub-emulator-evidence
          path: emulator-evidence/
          if-no-files-found: ignore
